<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6d5dfc">
<title>Репетитор — ученики, занятия, оплаты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#f3f1fb;--bg2:#e9e6fa;--card:#ffffff;--card2:#f8f7ff;--tx:#1b1840;--mut:#7a7899;--line:#ebe9f6;
  --pri:#6d5dfc;--pri2:#a45df0;--pink:#ff6bb0;--ok:#12b886;--bad:#f0476a;--warn:#f59f00;
  --shadow:0 1px 2px rgba(60,40,140,.05),0 8px 24px rgba(60,40,140,.08);
  --r:20px;--hh:54px;
  --grad:linear-gradient(135deg,#6d5dfc,#a45df0 60%,#ff6bb0);
  --f-head:'Unbounded','Manrope',system-ui,sans-serif;--f-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0f0e1c;--bg2:#171530;--card:#191833;--card2:#201e40;--tx:#eeecff;--mut:#9795bd;--line:#2a2850;
  --shadow:0 1px 2px #0006,0 8px 24px #0004;--pri:#8b7dff}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;font:500 15px/1.5 var(--f-body);color:var(--tx);min-height:100vh;
  background:radial-gradient(900px 500px at 8% -10%,#a45df022,transparent 60%),radial-gradient(700px 420px at 100% 0,#ff6bb01c,transparent 60%),var(--bg)}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px}.ic.lg{width:26px;height:26px}
h1,h2,h3{font-family:var(--f-head);margin:0;font-weight:600;letter-spacing:-.02em}
h2{font-size:20px}h3{font-size:15px}

/* шапка и навигация */
header{position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line)}
header::before{content:"";position:absolute;inset:0;z-index:-1;backdrop-filter:blur(16px);background:color-mix(in srgb,var(--bg) 78%,transparent)}
.bar{max-width:1040px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:10px;font:700 16px var(--f-head);letter-spacing:-.03em}
.logo i{width:36px;height:36px;border-radius:12px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px #6d5dfc55}
nav{display:flex;gap:4px;margin-left:auto;background:var(--card);padding:4px;border-radius:16px;box-shadow:var(--shadow)}
nav button{display:flex;align-items:center;gap:8px;background:none;border:0;border-radius:12px;padding:9px 14px;font:700 14px var(--f-body);color:var(--mut);cursor:pointer;transition:.2s}
nav button:hover{color:var(--tx)}
nav button.on{background:var(--grad);color:#fff;box-shadow:0 6px 16px #6d5dfc44}
.iconbtn{width:42px;height:42px;border-radius:14px;border:0;background:var(--card);color:var(--mut);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow)}
.iconbtn:hover{color:var(--pri)}
main{max-width:1040px;margin:0 auto;padding:20px 16px 100px}
@media(max-width:700px){
  .logo span{display:none}
  nav{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));margin:0;z-index:30;justify-content:space-around;border-radius:22px;padding:6px;box-shadow:0 10px 40px #20104a40}
  nav button{flex-direction:column;gap:2px;font-size:11px;padding:8px 10px;flex:1}
  .bar{justify-content:space-between}
}

/* карточки и кнопки */
.card{background:var(--card);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.mut{color:var(--mut);font-size:13px}
.btn{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:14px;padding:10px 16px;font:700 14px var(--f-body);cursor:pointer;color:#fff;background:var(--grad);box-shadow:0 6px 18px #6d5dfc40;transition:.15s}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:none}
.btn.g{background:var(--card2);color:var(--tx);box-shadow:none;border:1px solid var(--line)}
.btn.ok{color:#fff;background:linear-gradient(135deg,#12b886,#38d9a9);box-shadow:0 6px 18px #12b88640}
.btn.d{background:transparent;color:var(--bad);box-shadow:none;border:1px solid var(--line)}
.btn.s{padding:7px 12px;font-size:13px;border-radius:12px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--card2);color:var(--mut)}
.chip.ok{background:#12b88618;color:var(--ok)}.chip.bad{background:#f0476a18;color:var(--bad)}.chip.warn{background:#f59f0018;color:var(--warn)}.chip.pri{background:#6d5dfc18;color:var(--pri)}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.empty{text-align:center;color:var(--mut);padding:36px 12px}
.empty .ic{width:44px;height:44px;opacity:.5;margin-bottom:8px}
.avatar{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;color:#fff;font:700 15px var(--f-head);background:var(--c);flex:none}
.avatar.sm{width:32px;height:32px;border-radius:11px;font-size:12px}
.bar-p{height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.bar-p i{display:block;height:100%;border-radius:9px;background:var(--grad);transition:width .6s cubic-bezier(.2,.8,.2,1)}

/* обзор */
.hero{background:var(--grad);color:#fff;border-radius:26px;padding:22px;position:relative;overflow:hidden;margin-bottom:12px;box-shadow:0 14px 40px #6d5dfc50}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:#ffffff1c}
.hero::before{content:"";position:absolute;right:60px;bottom:-90px;width:180px;height:180px;border-radius:50%;background:#ffffff14}
.hero h1{font-size:22px;position:relative}
.hero .lv{display:inline-flex;align-items:center;gap:6px;background:#ffffff2e;border-radius:99px;padding:4px 12px;font-weight:800;font-size:13px;margin:8px 0 12px;position:relative}
.hero .bar-p{background:#ffffff33;position:relative}.hero .bar-p i{background:#fff}
.hero .xp{font-size:12px;opacity:.9;margin-top:6px;position:relative}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
@media(max-width:700px){.grid3{grid-template-columns:1fr 1fr}.grid3>.wide{grid-column:1/-1}}
.kpi{margin:0;display:flex;flex-direction:column;gap:2px}
.kpi b{font:700 22px var(--f-head);letter-spacing:-.03em}
.kpi .ico{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;margin-bottom:6px}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 16px var(--f-head)}
.sect{font:700 12px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:20px 4px 10px}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);margin-bottom:8px;border-left:5px solid var(--c,var(--pri))}
.li .t{font-weight:800}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ach>div{background:var(--card);border-radius:18px;padding:14px 12px;text-align:center;box-shadow:var(--shadow)}
.ach .ai{width:48px;height:48px;border-radius:16px;margin:0 auto 8px;display:grid;place-items:center;color:#fff;background:var(--grad);box-shadow:0 8px 18px #6d5dfc44}
.ach .lock{opacity:.5;filter:grayscale(1)}.ach .lock .ai{background:var(--line);color:var(--mut);box-shadow:none}
.ach b{display:block;font-size:13px;line-height:1.25}.ach span{font-size:11px;color:var(--mut)}

/* календарь */
.calbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.seg{display:flex;background:var(--card);border-radius:14px;padding:3px;box-shadow:var(--shadow)}
.seg button{border:0;background:none;padding:7px 14px;border-radius:11px;font:700 13px var(--f-body);color:var(--mut);cursor:pointer}
.seg button.on{background:var(--grad);color:#fff}
.ttl{font:600 17px var(--f-head);letter-spacing:-.02em;min-width:150px}
.ttl::first-letter{text-transform:uppercase}
.scroll{overflow-x:auto;border-radius:var(--r);background:var(--card);box-shadow:var(--shadow)}
.wk{min-width:760px}
.wk-h,.wk-b{display:grid;grid-template-columns:48px repeat(7,1fr)}
.wk-h{position:sticky;top:0;border-bottom:1px solid var(--line)}
.wk-h div{padding:10px 4px;text-align:center;font-size:12px;color:var(--mut);font-weight:700}
.wk-h div b{display:grid;place-items:center;width:32px;height:32px;margin:2px auto 0;border-radius:50%;font:700 15px var(--f-head);color:var(--tx)}
.wk-h .today b{background:var(--grad);color:#fff;box-shadow:0 6px 14px #6d5dfc50}
.gut{position:relative}
.gut span{position:absolute;right:8px;font-size:11px;color:var(--mut);transform:translateY(-50%);font-weight:600}
.col{position:relative;border-left:1px solid var(--line);cursor:cell;
  background-image:repeating-linear-gradient(to bottom,transparent 0 calc(var(--hh) - 1px),var(--line) calc(var(--hh) - 1px) var(--hh))}
.col.today{background-color:#6d5dfc0a}
.ev{position:absolute;left:3px;right:3px;border-radius:12px;padding:5px 8px;font-size:12px;line-height:1.25;overflow:hidden;cursor:pointer;
  background:color-mix(in srgb,var(--c) 17%,var(--card));border-left:4px solid var(--c);color:var(--tx);transition:.15s}
.ev:hover{transform:scale(1.02);z-index:3;box-shadow:0 6px 18px #0002}
.ev b{display:block;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.done{background:color-mix(in srgb,var(--c) 85%,#000);color:#fff}
.ev.cancelled{opacity:.45;text-decoration:line-through}
.ev.missed{background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--bad) 20%,var(--card)) 0 6px,transparent 6px 12px)}
.ev .ck{position:absolute;right:5px;top:5px;width:14px;height:14px}
.now{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:2;pointer-events:none}
.now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.mo{display:grid;grid-template-columns:repeat(7,1fr)}
.mo .dh{padding:10px 4px;text-align:center;font-size:12px;font-weight:700;color:var(--mut)}
.mo .d{min-height:104px;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:6px;cursor:pointer;transition:.15s;overflow:hidden}
.mo .d:nth-child(7n+8){border-left:0}
.mo .d:hover{background:var(--card2)}
.mo .d.out{opacity:.4}
.mo .d .n{font:700 13px var(--f-head);display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;margin-bottom:3px}
.mo .d.today .n{background:var(--grad);color:#fff}
.mo .c{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;border-radius:8px;padding:2px 6px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:color-mix(in srgb,var(--c) 18%,var(--card));border-left:3px solid var(--c)}
.mo .c.done{background:var(--c);color:#fff}.mo .c.cancelled{opacity:.45;text-decoration:line-through}
.mo .more{font-size:11px;color:var(--mut);font-weight:700;padding-left:4px}
@media(max-width:700px){
  .mo .d{min-height:64px;padding:3px}
  .mo .c{font-size:0;padding:0;height:7px;width:7px;border-radius:50%;border:0;display:inline-block;margin:1px;background:var(--c)}
  .mo .c *{display:none}
}

/* диалоги, формы, тосты */
dialog{border:0;border-radius:26px;padding:22px;width:min(460px,94vw);max-height:92vh;background:var(--card);color:var(--tx);box-shadow:0 30px 80px #20104a60;animation:pop .25s cubic-bezier(.2,.9,.3,1.2)}
dialog::backdrop{background:#10083a77;backdrop-filter:blur(4px)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}}
label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:12px 0 4px}
input,select,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:14px;font:600 15px var(--f-body);background:var(--card2);color:var(--tx);outline:0;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 4px #6d5dfc22}
select.flt{width:auto;padding:9px 12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw label{margin:0;cursor:pointer}
.sw input{display:none}
.sw span{display:block;padding:7px 12px;border-radius:12px;background:var(--card2);border:1.5px solid var(--line);font-size:13px;font-weight:700;color:var(--mut)}
.sw input:checked+span{background:var(--grad);color:#fff;border-color:transparent}
#toasts{position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(420px,92vw)}
.toast{display:flex;align-items:center;gap:12px;background:var(--tx);color:var(--bg);padding:12px 16px;border-radius:18px;font-weight:700;box-shadow:0 14px 40px #0005;animation:tin .4s cubic-bezier(.2,.9,.3,1.3);width:100%}
.toast .ti{width:36px;height:36px;border-radius:12px;background:var(--grad);display:grid;place-items:center;color:#fff;flex:none}
.toast small{display:block;font-weight:600;opacity:.7}
@keyframes tin{from{opacity:0;transform:translateY(-16px) scale(.9)}}
.cf{position:fixed;top:-20px;z-index:200;pointer-events:none;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--rot));opacity:.9}}
.auth{max-width:400px;margin:6vh auto 0;padding:28px 24px;text-align:center}
.auth .logo{justify-content:center;margin-bottom:6px;font-size:20px}
.auth form{text-align:left}.auth .btn{width:100%;justify-content:center;margin-top:18px}
.auth .msg{margin-top:12px;font-size:13px;font-weight:700;color:var(--bad);text-align:center}.auth .msg.ok{color:var(--ok)}
.auth .sw2{margin-top:16px;font-size:13px;color:var(--mut)}.auth .sw2 a{color:var(--pri);font-weight:800;cursor:pointer}
.noauth nav,.noauth #gear,.noauth #sync{display:none}
#sync{font-size:12px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.acts .btn{justify-content:center;padding:11px 8px}
.ev.evt{background:var(--c);color:#fff;border-left:0}.ev.evt span{display:block;opacity:.85}
.ev{cursor:grab}.ev .ck{stroke:currentColor}
.wk-ad{display:grid;grid-template-columns:48px repeat(7,1fr);border-bottom:1px solid var(--line);min-height:30px}
.wk-ad>div{padding:3px;border-left:1px solid var(--line)}.wk-ad>div:first-child{border:0}
.adc{display:block;background:var(--c);color:#fff;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700;margin-bottom:2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mo .c.evt{background:var(--c);color:#fff;border-left:0}
.rt{width:100%;border-collapse:collapse;font-size:14px}.rt th{text-align:left;font-size:12px;color:var(--mut);padding:8px 10px;border-bottom:1px solid var(--line)}
.rt td{padding:10px;border-bottom:1px solid var(--line)}.rt .n{text-align:right;white-space:nowrap}.rt tfoot td{font-weight:800;border-bottom:0}.tw{overflow-x:auto}
.onlyprint{display:none}
a.btn{text-decoration:none}
.fade{animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}}
@media print{:root{--bg:#fff;--card:#fff;--tx:#111;--mut:#555;--line:#ddd;--shadow:none}
 body{background:#fff}header,#toasts,.noprint,nav{display:none!important}main{padding:0;max-width:none}.card,.stat{box-shadow:none;border:1px solid #ddd}.onlyprint{display:block}.fade{animation:none}}
</style>
</head>
<body>

<symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
<symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v11m-4-4 4 4 4-4M5 20h14"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><path d="M12 16V5m-4 4 4-4 4 4M5 20h14"/></symbol>

<symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 19V5M8 7h7"/></symbol>
<symbol id="i-medal" viewBox="0 0 24 24"><circle cx="12" cy="9" r="5"/><path d="m8.5 13.5-1.5 7 5-2.5 5 2.5-1.5-7"/></symbol>
<symbol id="i-zap" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="18" height="0"/><rect x="5" y="11" width="14" height="10" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>

// ================= календарь =================
const DOW=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const dFromK=k=>new Date(k+'T00:00');
const dowOf=k=>(dFromK(k).getDay()+6)%7;
const fmtDate=k=>dFromK(k).toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
const fmtDM=k=>k.split('-').reverse().slice(0,2).join('.');
const hhmm=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const EVCOLORS=['#14b8a6','#22a6f2','#f59f00','#ef5b5b','#a45df0','#64748b'];

// ---- повторения (как в Google Календаре) ----
function genDates(startK,rule,limitK,maxN=400){
  const out=[],st=dFromK(startK),end=rule.end||{type:'never'};
  const hard=ymd(addDays(st,366*3));
  let lim=limitK;
  if(end.type==='count')lim=hard;
  else if(end.type==='until'&&end.until)lim=end.until<hard?end.until:hard;
  const maxCount=end.type==='count'?Math.max(1,+end.count||1):maxN;
  const days=rule.days&&rule.days.length?rule.days:[dowOf(startK)],m0=mondayOf(st),iv=Math.max(1,+rule.interval||1);
  for(let d=new Date(st);ymd(d)<=lim&&out.length<maxCount;d=addDays(d,1)){
    let ok=false;
    if(rule.freq==='daily')ok=Math.round((d-st)/864e5)%iv===0;
    else if(rule.freq==='weekly'){const wk=Math.round((mondayOf(d)-m0)/6048e5);ok=wk%iv===0&&days.includes((d.getDay()+6)%7)}
    else{const mo=(d.getFullYear()-st.getFullYear())*12+d.getMonth()-st.getMonth();
      const want=Math.min(st.getDate(),new Date(d.getFullYear(),d.getMonth()+1,0).getDate());ok=mo%iv===0&&d.getDate()===want}
    if(ok)out.push(ymd(d));
  }
  return out;
}
const horizon=()=>ymd(addDays(new Date(),183));
// бесконечные серии дописываем на ~6 месяцев вперёд
function extendSeries(){
  const lim=horizon();let ch=false;
  for(const[sid,sr]of Object.entries(db.series||{})){
    if(!sr.rule||sr.rule.end?.type!=='never'||!sr.genUntil||sr.genUntil>=lim)continue;
    const arr=sr.kind==='e'?db.events:db.lessons;
    const tpl=arr.filter(x=>x.series===sid).sort((a,b)=>b.date.localeCompare(a.date))[0];
    if(!tpl){delete db.series[sid];ch=true;continue}
    if(sr.kind==='l'&&!stu(tpl.student))continue;
    genDates(sr.start,sr.rule,lim).filter(d=>d>sr.genUntil).forEach(d=>{
      const n={...tpl,id:uid(),date:d,time:tpl.moved?tpl.moved.time:tpl.time};
      delete n.moved;delete n.moves;if(sr.kind==='l')n.status='planned';arr.push(n)});
    sr.genUntil=lim;ch=true;
  }
  return ch;
}
function ruleText(r){
  if(!r)return'';let t;
  const iv=r.interval||1;
  if(r.freq==='daily')t=iv===1?'Каждый день':`Каждые ${iv} дн.`;
  else if(r.freq==='weekly'){const d=(r.days||[]).map(i=>DOW[i]).join(', ');
    t=(iv===1?'Каждую неделю':iv===2?'Раз в 2 недели':`Каждые ${iv} нед.`)+(d?` (${d})`:'')}
  else t=iv===1?'Каждый месяц':`Каждые ${iv} мес.`;
  const e=r.end||{};
  if(e.type==='count')t+=`, ${e.count} раз`;else if(e.type==='until'&&e.until)t+=`, до ${fmtDM(e.until)}`;
  return t;
}

function recurTog(){
  const f=$('#f'),on=f.rep.value!=='none',cu=f.rep.value==='custom',sh=(id,v)=>$(id).style.display=v?'':'none';
  sh('#rc',on);sh('#rcust',cu);sh('#rdays',cu&&f.cUnit.value==='weekly');
  sh('#rcount',on&&f.endType.value==='count');sh('#runtil',on&&f.endType.value==='until');

function readRule(fd,date){
  const r=fd.get('rep');if(!r||r==='none')return null;
  const dow=dowOf(date);let rule;
  if(r==='daily')rule={freq:'daily',interval:1};
  else if(r==='weekly')rule={freq:'weekly',interval:1,days:[dow]};
  else if(r==='biweekly')rule={freq:'weekly',interval:2,days:[dow]};
  else if(r==='weekdays')rule={freq:'weekly',interval:1,days:[0,1,2,3,4]};
  else if(r==='monthly')rule={freq:'monthly',interval:1};
  else{rule={freq:fd.get('cUnit'),interval:Math.max(1,+fd.get('cInt')||1)};
    if(rule.freq==='weekly'){const ds=fd.getAll('cd').map(Number);if(!ds.includes(dow))ds.push(dow);rule.days=ds.sort()}}
  rule.end={type:fd.get('endType')||'never',count:+fd.get('endCount')||1,until:fd.get('endUntil')||''};
  if(rule.end.type==='until'&&!rule.end.until)rule.end={type:'never'};
  return rule;
}
// создать серию (или одиночный элемент); arrName: 'lessons' | 'events'
function createItems(arrName,kind,base,date,rule){
  const arr=db[arrName];
  if(!rule){arr.push({id:uid(),...base,date});return 1}
  const lim=horizon(),dates=genDates(date,rule,lim),sid=uid();
  db.series[sid]={kind,rule,start:date,time:base.time,genUntil:rule.end.type==='never'?lim:null};
  dates.forEach(d=>arr.push({id:uid(),...base,date:d,series:sid}));
  return dates.length;
}
const scopeRadios=(what='Применить к')=>`<label>${what}</label><div class="sw">

function scopeTargets(kind,it,scope){
  const arr=kind==='e'?db.events:db.lessons;
  if(!it.series||scope==='one')return[it];
  return arr.filter(x=>x.series===it.series&&(scope==='all'||x.date>=it.date)&&(x===it||kind==='e'||!charged(x)));
}
function removeScoped(kind,id,scope){
  const arr=kind==='e'?db.events:db.lessons,it=arr.find(x=>x.id===id);if(!it)return;
  const ids=new Set(scopeTargets(kind,it,scope).map(x=>x.id));
  if(kind==='e')db.events=db.events.filter(x=>!ids.has(x.id));else db.lessons=db.lessons.filter(x=>!ids.has(x.id));
  const sr=it.series&&db.series[it.series];
  if(sr){if(scope==='all')delete db.series[it.series];
    else if(scope==='following'){sr.rule.end={type:'until',until:ymd(addDays(dFromK(it.date),-1))};sr.genUntil=null}}

function delItem(kind,id){

function dragS(e,k,id){e.dataTransfer.setData('text/plain',k+':'+id);e.dataTransfer.effectAllowed='move';window.__dy=e.offsetY||0}
function dropEv(e,date,H0,HH){
  e.preventDefault();const[k,id]=e.dataTransfer.getData('text/plain').split(':');if(!id)return;

// ================= отчёт за месяц =================
let repDate=new Date(new Date().getFullYear(),new Date().getMonth(),1);
function repNav(n){repDate=new Date(repDate.getFullYear(),repDate.getMonth()+n,1);render()}
const repTitle=()=>repDate.toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
function repData(){
  const m=ymd(repDate).slice(0,7);
  const rows=db.students.map(s=>{
    const L=db.lessons.filter(l=>l.student===s.id&&l.date.startsWith(m));
    const done=L.filter(l=>l.status==='done'),miss=L.filter(l=>l.status==='missed');
    return{s,done:done.length,miss:miss.length,free:L.filter(l=>l.status==='cancelled').length,
      earned:[...done,...miss].reduce((a,l)=>a+l.price,0),
      paid:db.payments.filter(p=>p.student===s.id&&p.date.startsWith(m)).reduce((a,p)=>a+p.amount,0)};
  }).filter(r=>r.done||r.miss||r.free||r.paid);
  const tot=rows.reduce((a,r)=>({done:a.done+r.done,miss:a.miss+r.miss,free:a.free+r.free,earned:a.earned+r.earned,paid:a.paid+r.paid}),{done:0,miss:0,free:0,earned:0,paid:0});
  const rate=+db.taxRate||0;tot.tax=Math.round(tot.paid*rate/100);
  const pays=db.payments.filter(p=>p.date.startsWith(m)).sort((a,b)=>a.date.localeCompare(b.date));
  return{rows,tot,pays,rate};
}
function vReport(){
  const{rows,tot,pays,rate}=repData();
  let h=`<div class="head"><button class="iconbtn noprint" onclick="repNav(-1)">${ic('l')}</button><button class="iconbtn noprint" onclick="repNav(1)">${ic('r')}</button>
   <h2 class="sp" style="text-transform:none"><span class="ttl" style="font-size:20px">${repTitle()}</span></h2>
   <button class="btn g s noprint" onclick="repCSV()">${ic('down','sm')}CSV</button><button class="btn s noprint" onclick="window.print()">${ic('down','sm')}PDF / печать</button></div>
   <div class="onlyprint" style="margin-bottom:10px"><h2>Отчёт за ${repTitle()}${db.name?' · '+esc(db.name):''}</h2></div>
   <div class="stats">
    <div class="stat"><span class="mut">Получено оплат</span><b>${money(tot.paid)}</b></div>
    <div class="stat"><span class="mut">Начислено за занятия</span><b>${money(tot.earned)}</b></div>
    <div class="stat"><span class="mut">Налог ${rate}% (с оплат)</span><b>${money(tot.tax)}</b></div>
    <div class="stat"><span class="mut">Проведено занятий</span><b>${tot.done}</b></div></div>`;
  if(!rows.length)return h+`<div class="card empty">${ic('chart')}<p>За этот месяц данных нет</p></div>`;
  h+=`<div class="card tw"><table class="rt"><thead><tr><th>Ученик</th><th class="n">Проведено</th><th class="n">Платных пропусков</th><th class="n">Бесплатных</th><th class="n">Начислено</th><th class="n">Получено</th></tr></thead><tbody>
   ${rows.map(r=>`<tr><td><b>${esc(r.s.name)}</b></td><td class="n">${r.done}</td><td class="n">${r.miss}</td><td class="n">${r.free}</td><td class="n">${money(r.earned)}</td><td class="n">${money(r.paid)}</td></tr>`).join('')}</tbody>
   <tfoot><tr><td>Итого</td><td class="n">${tot.done}</td><td class="n">${tot.miss}</td><td class="n">${tot.free}</td><td class="n">${money(tot.earned)}</td><td class="n">${money(tot.paid)}</td></tr></tfoot></table></div>`;
  if(pays.length)h+=`<div class="sect">Оплаты за месяц</div><div class="card tw"><table class="rt"><thead><tr><th>Дата</th><th>Ученик</th><th>Способ</th><th class="n">Сумма</th></tr></thead><tbody>
   ${pays.map(p=>`<tr><td>${fmtDM(p.date)}</td><td>${esc(stu(p.student)?.name||'удалён')}</td><td>${esc(p.method)}${p.note?' · '+esc(p.note):''}</td><td class="n">${money(p.amount)}</td></tr>`).join('')}</tbody></table></div>`;
  h+=`<p class="mut noprint">Налог считается от полученных оплат за месяц по ставке из настроек (шестерёнка). Это справочная сумма, проверьте действующие правила в налоговой.</p>`;
  return h;
}
function repCSV(){
  const{rows,tot,pays,rate}=repData();
  const q=v=>{v=String(v??'');return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const L=[[`Отчёт за ${repTitle()}`],[],['Ученик','Проведено','Платных пропусков','Бесплатных пропусков','Начислено, ₸','Получено, ₸'],
    ...rows.map(r=>[r.s.name,r.done,r.miss,r.free,r.earned,r.paid]),
    ['Итого',tot.done,tot.miss,tot.free,tot.earned,tot.paid],[`Налог ${rate}%`,'','','','',tot.tax],[],
    ['Оплаты'],['Дата','Ученик','Сумма, ₸','Способ','Заметка'],
    ...pays.map(p=>[p.date,stu(p.student)?.name||'',p.amount,p.method,p.note||''])];
  const csv='﻿'+L.map(r=>r.map(q).join(';')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=`report-${ymd(repDate).slice(0,7)}.csv`;a.click();
}

// ================= кабинет родителя =================
const cabLink=t=>location.href.split('#')[0].split('?')[0]+'?c='+t;
function newToken(){const a=new Uint8Array(24);crypto.getRandomValues(a);const c='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';return[...a].map(x=>c[x%62]).join('')}
const cabCache={};
function snapshot(s){
  const lo=ymd(addDays(new Date(),-90)),hi=ymd(addDays(new Date(),60));
  return{name:s.name,tutor:db.name||'',bal:balance(s.id),pkg:pkgInfo(s.id),
    lessons:db.lessons.filter(l=>l.student===s.id&&l.date>=lo&&l.date<=hi).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))
      .map(l=>({d:l.date,t:l.time,dur:l.dur,sub:l.subject||'',st:l.status,p:l.price,mv:l.moved?{d:l.moved.date,t:l.moved.time}:null})),
    hw:db.homework.filter(h=>h.student===s.id).sort((a,b)=>(b.due||'').localeCompare(a.due||'')).slice(0,30)
      .map(h=>({title:h.title,desc:h.desc,due:h.due,st:h.status,c:h.comment||''})),
    pays:db.payments.filter(p=>p.student===s.id).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,20).map(p=>({d:p.date,a:p.amount,m:p.method})),
    at:new Date().toISOString()};
}
async function pushCab(s,force){
  const data=snapshot(s),key=JSON.stringify({...data,at:0});
  if(!force&&cabCache[s.share]===key)return null;
  const{error}=await sb.from('cabinets').upsert({token:s.share,user_id:user.id,student_id:s.id,data,updated_at:new Date().toISOString()},{onConflict:'token'});
  if(!error)cabCache[s.share]=key;
  return error||null;
}
const pushCabs=()=>Promise.all(db.students.filter(s=>s.share).map(s=>pushCab(s)));
function shareForm(sid){
  const s=stu(sid);
  if(!CLOUD)return openDlg(`<h2>Кабинет родителя</h2><p class="mut">Ссылки для родителей работают только при подключённом облаке (Supabase) и входе в аккаунт.</p><div class="row"><span class="sp"></span><button class="btn g" onclick="dlg.close()">Закрыть</button></div>`);
  if(!s.share)return openDlg(`<h2>Кабинет родителя</h2><p class="mut">Создайте ссылку для ${esc(s.name)} и отправьте её родителю или ученику. Регистрация не нужна. Они увидят расписание, домашние задания, оплаты и остаток пакета. Ваши заметки скрыты.</p>
    <div class="row" style="margin-top:14px"><span class="sp"></span><button class="btn g" onclick="dlg.close()">Отмена</button><button class="btn" onclick="enableShare('${sid}')">${ic('share','sm')}Создать ссылку</button></div>`);
  const link=cabLink(s.share),msg=`Здравствуйте! Расписание, домашние задания и оплаты (${s.name}): ${link}`;
  openDlg(`<h2>Кабинет родителя</h2><p class="mut">Ссылка для ${esc(s.name)}. Любой, у кого она есть, видит этот кабинет. Данные обновляются, когда вы открываете приложение.</p>
   <input readonly value="${esc(link)}" onclick="this.select()" id="cl">
   <div class="row" style="margin-top:12px"><button class="btn s" onclick="copyLink('${esc(link)}')">${ic('copy','sm')}Копировать</button>
    <a class="btn g s" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(msg)}">WhatsApp</a>
    <a class="btn g s" target="_blank" rel="noopener" href="https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent('Расписание и задания: '+s.name)}">Telegram</a></div>
   <div class="row" style="margin-top:14px"><button class="btn d s" onclick="disableShare('${sid}')">Отключить ссылку</button><button class="btn g s" onclick="disableShare('${sid}',true)">Новая ссылка</button><span class="sp"></span><button class="btn g" onclick="dlg.close()">Закрыть</button></div>`);
}
async function copyLink(l){try{await navigator.clipboard.writeText(l);toast('check','Ссылка скопирована')}catch(e){const i=$('#cl');i&&i.select();toast('alert','Скопируйте ссылку вручную')}}
async function enableShare(sid){
  const s=stu(sid);s.share=newToken();
  const err=await pushCab(s,true);
  if(err){delete s.share;toast('alert','Не удалось создать ссылку','Выполните supabase/cabinet.sql в Supabase. '+err.message);return}
  save();shareForm(sid);render();
}
async function disableShare(sid,regen){
  const s=stu(sid);if(!regen&&!confirm('Отключить ссылку? Родитель потеряет доступ.'))return;
  await sb.from('cabinets').delete().eq('token',s.share);delete cabCache[s.share];delete s.share;save();
  if(regen)return enableShare(sid);
  shareForm(sid);render();
}
// страница родителя: открывается по ссылке ?c=...
async function cabinetBoot(token){
  document.body.classList.add('noauth');
  const app=$('#app');app.innerHTML='<div class="empty">Загрузка…</div>';
  const fail=()=>app.innerHTML=`<div class="card empty fade">${ic('lock')}<h3>Ссылка недействительна</h3><p class="mut">Возможно, репетитор отключил доступ. Попросите новую ссылку.</p></div>`;
  if(!sb)return fail();
  const{data,error}=await sb.rpc('get_cabinet',{p_token:token});
  if(error||!data)return fail();
  app.innerHTML=`<div class="fade">${vCabinet(data)}</div>`;
}
function vCabinet(d){
  const t=today();
  const up=d.lessons.filter(l=>l.st==='planned'&&l.d>=t);
  const past=d.lessons.filter(l=>!(l.st==='planned'&&l.d>=t)).sort((a,b)=>(b.d+b.t).localeCompare(a.d+a.t)).slice(0,15);
  const row=l=>`<div class="li"><div class="sp"><div class="t">${fmtDate(l.d)}, ${l.t}</div>
    <div class="mut">${l.dur} мин${l.sub?' · '+esc(l.sub):''}${l.mv?` · перенесено с ${fmtDM(l.mv.d)} ${l.mv.t}`:''}</div></div>
    <span class="chip ${l.st==='done'?'ok':l.st==='missed'?'bad':l.st==='cancelled'?'warn':'pri'}">${ST[l.st]}</span></div>`;
  const hw=h=>`<div class="li"><div class="sp"><div class="t">${esc(h.title)}</div><div class="mut">${h.due?'срок '+fmtDM(h.due):''}${h.desc?' · '+esc(h.desc):''}${h.c?' · Комментарий: '+esc(h.c):''}</div></div>
    ${hwChip({status:h.st,due:h.due})}</div>`;
  const pk=d.pkg;
  return `<div class="hero"><h1>${esc(d.name)}</h1><div class="lv">${ic('book','sm')}${d.tutor?'Репетитор: '+esc(d.tutor):'Кабинет ученика'}</div>
    <div class="xp">Обновлено ${new Date(d.at).toLocaleString('ru-RU',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})}</div></div>
   <div class="grid3"><div class="card kpi"><span class="mut">Баланс</span><div style="margin-top:6px">${balChip(d.bal)}</div></div>
    ${pk?`<div class="card kpi"><span class="mut">Пакет занятий</span><b>${Math.max(0,pk.left)} из ${pk.total}</b><span class="mut">осталось</span></div>`:''}
    <div class="card kpi"><span class="mut">Ближайшее занятие</span><b style="font-size:16px">${up[0]?fmtDM(up[0].d)+' · '+up[0].t:'—'}</b></div></div>
   <div class="sect">Расписание</div>${up.length?up.map(row).join(''):'<div class="card empty" style="padding:22px">Занятий в плане нет</div>'}
   <div class="sect">Домашние задания</div>${d.hw.length?d.hw.map(hw).join(''):'<div class="card empty" style="padding:22px">Заданий нет</div>'}
   <div class="sect">Оплаты</div>${d.pays.length?d.pays.map(p=>`<div class="li"><div class="sp"><div class="t ok">+${money(p.a)}</div><div class="mut">${fmtDM(p.d)} · ${esc(p.m)}</div></div></div>`).join(''):'<div class="card empty" style="padding:22px">Оплат пока нет</div>'}
   ${past.length?`<div class="sect">История занятий</div>${past.map(row).join('')}`:''}`;
}

// ================= профиль и копии =================
function profileForm(){
  openDlg(`<h2>Профиль и данные</h2><form id="f">
   <label>Ваше имя</label><input name="name" value="${esc(db.name)}" placeholder="Как к вам обращаться">
   <div class="two"><div><label>Цель по доходу на месяц, ₸</label><input type="number" name="goal" min="0" step="1000" value="${db.goal}"></div>
   <div><label>Налог, % (для отчёта)</label><input type="number" name="taxRate" min="0" max="100" step="0.5" value="${db.taxRate}"></div></div>
   <div class="row" style="margin-top:16px"><button type="button" class="btn g s" onclick="exportData()">${ic('down','sm')}Скачать копию</button>
   <button type="button" class="btn g s" onclick="importData()">${ic('up','sm')}Загрузить копию</button></div>
   ${CLOUD?`<p class="mut">Вы вошли как <b>${esc(user.email)}</b>. Данные хранятся в облаке и доступны на всех ваших устройствах.</p><button type="button" class="btn d s" onclick="signOut()">Выйти</button>`:`<p class="mut">Данные хранятся только в этом браузере. Делайте копию хотя бы раз в неделю.</p>`}${btns()}</form>`);
  $('#f').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));db.name=f.name.trim();db.goal=+f.goal||0;db.taxRate=+f.taxRate||0;save();dlg.close();render()};
}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,1)],{type:'application/json'}));a.download=`tutor-backup-${today()}.json`;a.click()}
function importData(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{try{const d=JSON.parse(await i.files[0].text());
  if(!d.students||!d.lessons||!d.payments)throw 0;if(confirm('Заменить текущие данные резервной копией?')){db=norm(d);
  db.students.forEach((s,k)=>{if(!s.color)s.color=COLORS[k%8]});save();dlg.close();render()}}catch(e){alert('Неверный файл')}};i.click()}


// ================= вход =================
let authMode='in';
const ERR={'Invalid login credentials':'Неверная почта или пароль','User already registered':'Такая почта уже зарегистрирована',
  'Email not confirmed':'Подтвердите почту по ссылке из письма'};
function showAuth(msg='',okMsg=false){
  document.body.classList.add('noauth');
  const up=authMode==='up';
  $('#app').innerHTML=`<div class="card auth fade"><div class="logo"><i>${ic('book')}</i><span style="display:inline">Репетитор</span></div>
   <p class="mut">${up?'Создайте аккаунт, чтобы заходить с любого устройства':'Войдите, чтобы увидеть своих учеников и занятия'}</p>
   <form id="af"><label>Почта</label><input type="email" name="email" required autocomplete="email">
   <label>Пароль</label><input type="password" name="password" minlength="6" required autocomplete="${up?'new-password':'current-password'}" placeholder="Не короче 6 символов">
   <button class="btn">${up?'Зарегистрироваться':'Войти'}</button></form>
   <div class="msg ${okMsg?'ok':''}" id="amsg">${esc(msg||(sb?'':'Не удалось загрузить библиотеку Supabase. Проверьте интернет.'))}</div>
   <div class="sw2">${up?'Уже есть аккаунт?':'Нет аккаунта?'} <a onclick="authMode='${up?'in':'up'}';showAuth()">${up?'Войти':'Зарегистрироваться'}</a></div></div>`;
  $('#af').onsubmit=authSubmit;
}
async function authSubmit(e){
  e.preventDefault();if(!sb)return;
  const f=Object.fromEntries(new FormData(e.target)),b=e.target.querySelector('button');b.disabled=true;
  const{data,error}=await(authMode==='in'?sb.auth.signInWithPassword(f):sb.auth.signUp(f));
  b.disabled=false;
  if(error)return showAuth(ERR[error.message]||(/least 6/.test(error.message)?'Пароль должен быть не короче 6 символов':error.message));
  if(authMode==='up'&&!data.session){authMode='in';showAuth('Мы отправили письмо. Подтвердите почту и войдите.',true)}
}
async function signOut(){dlg.close();await sb.auth.signOut()}
dlg.addEventListener('close',()=>{hwCur=null});
async function onSession(s){
  user=s?.user||null;
  if(!user){db=blank();render();return}
  document.body.classList.remove('noauth');
  await pull();render();pushCabs();
}
async function boot(){
  const cab=new URLSearchParams(location.search).get('c');
  if(cab)return cabinetBoot(cab);
  if(!CLOUD){fixColors();render();return}
  if(!sb){showAuth();return}
  const{data:{session}}=await sb.auth.getSession();
  await onSession(session);
  sb.auth.onAuthStateChange((ev,s)=>{
    if(ev==='SIGNED_OUT'||(ev==='SIGNED_IN'&&s&&(!user||user.id!==s.user.id)))setTimeout(()=>onSession(s),0)});
  // подтянуть изменения, сделанные на другом устройстве
  document.addEventListener('visibilitychange',async()=>{
    if(document.hidden||!user||dirty||dlg.open)return;
    const{data}=await sb.from('tutor_data').select('updated_at').eq('user_id',user.id).maybeSingle();
    if(data&&remoteAt&&new Date(data.updated_at)>new Date(remoteAt)){await pull();render()}});
}
boot();
</script>
