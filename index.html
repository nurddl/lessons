<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6d5dfc">
<title>Репетитор — ученики, занятия, оплаты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f1fb;--bg2:#e9e6fa;--card:#ffffff;--card2:#f8f7ff;--tx:#1b1840;--mut:#7a7899;--line:#ebe9f6;
  --pri:#6d5dfc;--pri2:#a45df0;--pink:#ff6bb0;--ok:#12b886;--bad:#f0476a;--warn:#f59f00;
  --shadow:0 1px 2px rgba(60,40,140,.05),0 8px 24px rgba(60,40,140,.08);
  --r:20px;--hh:54px;
  --grad:linear-gradient(135deg,#6d5dfc,#a45df0 60%,#ff6bb0);
  --f-head:'Unbounded','Manrope',system-ui,sans-serif;--f-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0f0e1c;--bg2:#171530;--card:#191833;--card2:#201e40;--tx:#eeecff;--mut:#9795bd;--line:#2a2850;
  --shadow:0 1px 2px #0006,0 8px 24px #0004;--pri:#8b7dff}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;font:500 15px/1.5 var(--f-body);color:var(--tx);min-height:100vh;
  background:radial-gradient(900px 500px at 8% -10%,#a45df022,transparent 60%),radial-gradient(700px 420px at 100% 0,#ff6bb01c,transparent 60%),var(--bg)}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px}.ic.lg{width:26px;height:26px}
h1,h2,h3{font-family:var(--f-head);margin:0;font-weight:600;letter-spacing:-.02em}
h2{font-size:20px}h3{font-size:15px}

/* шапка и навигация */
header{position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line)}
header::before{content:"";position:absolute;inset:0;z-index:-1;backdrop-filter:blur(16px);background:color-mix(in srgb,var(--bg) 78%,transparent)}
.bar{max-width:1040px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:10px;font:700 16px var(--f-head);letter-spacing:-.03em}
.logo i{width:36px;height:36px;border-radius:12px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px #6d5dfc55}
nav{display:flex;gap:4px;margin-left:auto;background:var(--card);padding:4px;border-radius:16px;box-shadow:var(--shadow)}
nav button{display:flex;align-items:center;gap:8px;background:none;border:0;border-radius:12px;padding:9px 14px;font:700 14px var(--f-body);color:var(--mut);cursor:pointer;transition:.2s}
nav button:hover{color:var(--tx)}
nav button.on{background:var(--grad);color:#fff;box-shadow:0 6px 16px #6d5dfc44}
.iconbtn{width:42px;height:42px;border-radius:14px;border:0;background:var(--card);color:var(--mut);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow)}
.iconbtn:hover{color:var(--pri)}
main{max-width:1040px;margin:0 auto;padding:20px 16px 100px}
@media(max-width:700px){
  .logo span{display:none}
  nav{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));margin:0;z-index:30;justify-content:space-around;border-radius:22px;padding:6px;box-shadow:0 10px 40px #20104a40}
  nav button{flex-direction:column;gap:2px;font-size:11px;padding:8px 10px;flex:1}
  .bar{justify-content:space-between}
}

/* карточки и кнопки */
.card{background:var(--card);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.mut{color:var(--mut);font-size:13px}
.btn{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:14px;padding:10px 16px;font:700 14px var(--f-body);cursor:pointer;color:#fff;background:var(--grad);box-shadow:0 6px 18px #6d5dfc40;transition:.15s}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:none}
.btn.g{background:var(--card2);color:var(--tx);box-shadow:none;border:1px solid var(--line)}
.btn.ok{color:#fff;background:linear-gradient(135deg,#12b886,#38d9a9);box-shadow:0 6px 18px #12b88640}
.btn.d{background:transparent;color:var(--bad);box-shadow:none;border:1px solid var(--line)}
.btn.s{padding:7px 12px;font-size:13px;border-radius:12px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--card2);color:var(--mut)}
.chip.ok{background:#12b88618;color:var(--ok)}.chip.bad{background:#f0476a18;color:var(--bad)}.chip.warn{background:#f59f0018;color:var(--warn)}.chip.pri{background:#6d5dfc18;color:var(--pri)}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.empty{text-align:center;color:var(--mut);padding:36px 12px}
.empty .ic{width:44px;height:44px;opacity:.5;margin-bottom:8px}
.avatar{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;color:#fff;font:700 15px var(--f-head);background:var(--c);flex:none}
.avatar.sm{width:32px;height:32px;border-radius:11px;font-size:12px}
.bar-p{height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.bar-p i{display:block;height:100%;border-radius:9px;background:var(--grad);transition:width .6s cubic-bezier(.2,.8,.2,1)}

/* обзор */
.hero{background:var(--grad);color:#fff;border-radius:26px;padding:22px;position:relative;overflow:hidden;margin-bottom:12px;box-shadow:0 14px 40px #6d5dfc50}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:#ffffff1c}
.hero::before{content:"";position:absolute;right:60px;bottom:-90px;width:180px;height:180px;border-radius:50%;background:#ffffff14}
.hero h1{font-size:22px;position:relative}
.hero .lv{display:inline-flex;align-items:center;gap:6px;background:#ffffff2e;border-radius:99px;padding:4px 12px;font-weight:800;font-size:13px;margin:8px 0 12px;position:relative}
.hero .bar-p{background:#ffffff33;position:relative}.hero .bar-p i{background:#fff}
.hero .xp{font-size:12px;opacity:.9;margin-top:6px;position:relative}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
@media(max-width:700px){.grid3{grid-template-columns:1fr 1fr}.grid3>.wide{grid-column:1/-1}}
.kpi{margin:0;display:flex;flex-direction:column;gap:2px}
.kpi b{font:700 22px var(--f-head);letter-spacing:-.03em}
.kpi .ico{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;margin-bottom:6px}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 16px var(--f-head)}
.sect{font:700 12px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:20px 4px 10px}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);margin-bottom:8px;border-left:5px solid var(--c,var(--pri))}
.li .t{font-weight:800}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ach>div{background:var(--card);border-radius:18px;padding:14px 12px;text-align:center;box-shadow:var(--shadow)}
.ach .ai{width:48px;height:48px;border-radius:16px;margin:0 auto 8px;display:grid;place-items:center;color:#fff;background:var(--grad);box-shadow:0 8px 18px #6d5dfc44}
.ach .lock{opacity:.5;filter:grayscale(1)}.ach .lock .ai{background:var(--line);color:var(--mut);box-shadow:none}
.ach b{display:block;font-size:13px;line-height:1.25}.ach span{font-size:11px;color:var(--mut)}

/* календарь */
.calbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.seg{display:flex;background:var(--card);border-radius:14px;padding:3px;box-shadow:var(--shadow)}
.seg button{border:0;background:none;padding:7px 14px;border-radius:11px;font:700 13px var(--f-body);color:var(--mut);cursor:pointer}
.seg button.on{background:var(--grad);color:#fff}
.ttl{font:600 17px var(--f-head);letter-spacing:-.02em;min-width:150px}
.ttl::first-letter{text-transform:uppercase}
.scroll{overflow-x:auto;border-radius:var(--r);background:var(--card);box-shadow:var(--shadow)}
.wk{min-width:760px}
.wk-h,.wk-b{display:grid;grid-template-columns:48px repeat(7,1fr)}
.wk-h{position:sticky;top:0;border-bottom:1px solid var(--line)}
.wk-h div{padding:10px 4px;text-align:center;font-size:12px;color:var(--mut);font-weight:700}
.wk-h div b{display:grid;place-items:center;width:32px;height:32px;margin:2px auto 0;border-radius:50%;font:700 15px var(--f-head);color:var(--tx)}
.wk-h .today b{background:var(--grad);color:#fff;box-shadow:0 6px 14px #6d5dfc50}
.gut{position:relative}
.gut span{position:absolute;right:8px;font-size:11px;color:var(--mut);transform:translateY(-50%);font-weight:600}
.col{position:relative;border-left:1px solid var(--line);cursor:cell;
  background-image:repeating-linear-gradient(to bottom,transparent 0 calc(var(--hh) - 1px),var(--line) calc(var(--hh) - 1px) var(--hh))}
.col.today{background-color:#6d5dfc0a}
.ev{position:absolute;left:3px;right:3px;border-radius:12px;padding:5px 8px;font-size:12px;line-height:1.25;overflow:hidden;cursor:pointer;
  background:color-mix(in srgb,var(--c) 17%,var(--card));border-left:4px solid var(--c);color:var(--tx);transition:.15s}
.ev:hover{transform:scale(1.02);z-index:3;box-shadow:0 6px 18px #0002}
.ev b{display:block;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.done{background:color-mix(in srgb,var(--c) 85%,#000);color:#fff}
.ev.cancelled{opacity:.45;text-decoration:line-through}
.ev.missed{background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--bad) 20%,var(--card)) 0 6px,transparent 6px 12px)}
.ev .ck{position:absolute;right:5px;top:5px;width:14px;height:14px}
.now{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:2;pointer-events:none}
.now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.mo{display:grid;grid-template-columns:repeat(7,1fr)}
.mo .dh{padding:10px 4px;text-align:center;font-size:12px;font-weight:700;color:var(--mut)}
.mo .d{min-height:104px;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:6px;cursor:pointer;transition:.15s;overflow:hidden}
.mo .d:nth-child(7n+8){border-left:0}
.mo .d:hover{background:var(--card2)}
.mo .d.out{opacity:.4}
.mo .d .n{font:700 13px var(--f-head);display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;margin-bottom:3px}
.mo .d.today .n{background:var(--grad);color:#fff}
.mo .c{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;border-radius:8px;padding:2px 6px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:color-mix(in srgb,var(--c) 18%,var(--card));border-left:3px solid var(--c)}
.mo .c.done{background:var(--c);color:#fff}.mo .c.cancelled{opacity:.45;text-decoration:line-through}
.mo .more{font-size:11px;color:var(--mut);font-weight:700;padding-left:4px}
@media(max-width:700px){
  .mo .d{min-height:64px;padding:3px}
  .mo .c{font-size:0;padding:0;height:7px;width:7px;border-radius:50%;border:0;display:inline-block;margin:1px;background:var(--c)}
  .mo .c *{display:none}
}

/* диалоги, формы, тосты */
dialog{border:0;border-radius:26px;padding:22px;width:min(460px,94vw);max-height:92vh;background:var(--card);color:var(--tx);box-shadow:0 30px 80px #20104a60;animation:pop .25s cubic-bezier(.2,.9,.3,1.2)}
dialog::backdrop{background:#10083a77;backdrop-filter:blur(4px)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}}
label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:12px 0 4px}
input,select,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:14px;font:600 15px var(--f-body);background:var(--card2);color:var(--tx);outline:0;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 4px #6d5dfc22}
select.flt{width:auto;padding:9px 12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw label{margin:0;cursor:pointer}
.sw input{display:none}
.sw span{display:block;padding:7px 12px;border-radius:12px;background:var(--card2);border:1.5px solid var(--line);font-size:13px;font-weight:700;color:var(--mut)}
.sw input:checked+span{background:var(--grad);color:#fff;border-color:transparent}
#toasts{position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(420px,92vw)}
.toast{display:flex;align-items:center;gap:12px;background:var(--tx);color:var(--bg);padding:12px 16px;border-radius:18px;font-weight:700;box-shadow:0 14px 40px #0005;animation:tin .4s cubic-bezier(.2,.9,.3,1.3);width:100%}
.toast .ti{width:36px;height:36px;border-radius:12px;background:var(--grad);display:grid;place-items:center;color:#fff;flex:none}
.toast small{display:block;font-weight:600;opacity:.7}
@keyframes tin{from{opacity:0;transform:translateY(-16px) scale(.9)}}
.cf{position:fixed;top:-20px;z-index:200;pointer-events:none;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--rot));opacity:.9}}
.fade{animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}}
</style>
</head>

<header><div class="bar">
  <div class="logo"><i><svg class="ic"><use href="#i-book"/></svg></i><span>Репетитор</span></div>
  <nav id="nav">
    <button data-v="home"><svg class="ic"><use href="#i-home"/></svg>Обзор</button>
    <button data-v="cal"><svg class="ic"><use href="#i-cal"/></svg>Календарь</button>
    <button data-v="students"><svg class="ic"><use href="#i-users"/></svg>Ученики</button>
    <button data-v="pay"><svg class="ic"><use href="#i-wallet"/></svg>Оплаты</button>
  </nav>
  <button class="iconbtn" onclick="profileForm()" title="Профиль и данные"><svg class="ic"><use href="#i-gear"/></svg></button>
</div></header>
<main id="app"></main>
<div id="toasts"></div>
<dialog id="dlg"></dialog>

<script>
// ================= данные =================
const KEY='tutor.v1';
let db=load();
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.students)return Object.assign({name:'',goal:300000,ach:[],lvl:1},d)}catch(e){}
  return{students:[],lessons:[],payments:[],name:'',goal:300000,ach:[],lvl:1}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>new Intl.NumberFormat('ru-RU').format(Math.round(n))+' ₸';
const ymd=d=>d.toLocaleDateString('sv');
const today=()=>ymd(new Date());
const stu=id=>db.students.find(s=>s.id===id);
const ic=(n,c='')=>`<svg class="ic ${c}"><use href="#i-${n}"/></svg>`;
const COLORS=['#6d5dfc','#ff6bb0','#12b886','#f59f00','#22a6f2','#ef5b5b','#a45df0','#14b8a6'];
const initials=n=>n.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const avatar=(s,c='')=>`<div class="avatar ${c}" style="--c:${s?.color||'#999'}">${esc(initials(s?.name||'?'))}</div>`;
const toMin=t=>{const[a,b]=t.split(':');return +a*60+ +b};
const mondayOf=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-(x.getDay()+6)%7);return x};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const ST={planned:'Запланировано',done:'Проведено',missed:'Пропуск (платный)',cancelled:'Отменено'};
const charged=l=>l.status==='done'||l.status==='missed';
function balance(sid){
  const p=db.payments.filter(x=>x.student===sid).reduce((a,x)=>a+x.amount,0);
  const c=db.lessons.filter(l=>l.student===sid&&charged(l)).reduce((a,l)=>a+l.price,0);
  return p-c; // <0 долг, >0 предоплата
}
const balChip=b=>b<0?`<span class="chip bad">${ic('alert','sm')}долг ${money(-b)}</span>`:b>0?`<span class="chip pri">${ic('zap','sm')}предоплата ${money(b)}</span>`:`<span class="chip ok">${ic('check','sm')}оплачено</span>`;

// ================= геймификация =================
function stats(){
  const done=db.lessons.filter(l=>l.status==='done');
  const m=today().slice(0,7);
  const income=db.payments.reduce((a,p)=>a+p.amount,0);
  const monthInc=db.payments.filter(p=>p.date.startsWith(m)).reduce((a,p)=>a+p.amount,0);
  const debt=db.students.reduce((a,s)=>a+Math.max(0,-balance(s.id)),0);
  const weeks=new Set(done.map(l=>ymd(mondayOf(new Date(l.date+'T00:00')))));
  let w=mondayOf(new Date()),streak=0;
  if(!weeks.has(ymd(w)))w=addDays(w,-7);
  while(weeks.has(ymd(w))){streak++;w=addDays(w,-7)}
  return{students:db.students.length,done:done.length,pays:db.payments.length,income,monthInc,debt,streak,
    planned:db.lessons.filter(l=>l.status==='planned'&&l.date>=today()).length}
}
const ACH=[
 ['first_s','users','Первый ученик','Добавьте ученика',s=>s.students>=1],
 ['five_s','crown','Свой класс','5 учеников',s=>s.students>=5],
 ['first_l','check','Первое занятие','Проведите 1 занятие',s=>s.done>=1],
 ['l10','zap','Разгон','10 занятий',s=>s.done>=10],
 ['l50','medal','Опытный','50 занятий',s=>s.done>=50],
 ['l100','trophy','Сотка','100 занятий',s=>s.done>=100],
 ['first_p','wallet','Первая оплата','Запишите оплату',s=>s.pays>=1],
 ['e100','star','100 000 ₸','Заработано всего',s=>s.income>=100000],
 ['e1m','rocket','Миллионер','1 000 000 ₸ всего',s=>s.income>=1000000],
 ['streak4','flame','Огонь!','4 недели подряд',s=>s.streak>=4],
 ['goal','target','Цель месяца','Выполните цель',s=>db.goal>0&&s.monthInc>=db.goal],
 ['clean','spark','Чистый баланс','Нет долгов (5+ занятий)',s=>s.done>=5&&s.debt===0]
];
const TITLES=['Новичок','Практикант','Наставник','Мастер','Гуру','Легенда'];
const thr=n=>50*n*(n-1);
const lvlOf=xp=>Math.floor((1+Math.sqrt(1+xp/12.5))/2);
function xpOf(s){return s.done*20+s.pays*10+s.students*25+db.ach.length*50}
function toast(icon,title,sub=''){
  const t=document.createElement('div');t.className='toast';
  t.innerHTML=`<div class="ti">${ic(icon)}</div><div>${title}${sub?`<small>${sub}</small>`:''}</div>`;
  $('#toasts').appendChild(t);setTimeout(()=>{t.style.transition='.4s';t.style.opacity=0;setTimeout(()=>t.remove(),400)},3400)}
function confetti(n=70){
  for(let i=0;i<n;i++){const e=document.createElement('i');e.className='cf';
    e.style.cssText=`left:${Math.random()*100}vw;width:${6+Math.random()*7}px;height:${8+Math.random()*8}px;background:${COLORS[i%8]};
    --dx:${(Math.random()-.5)*300}px;--rot:${Math.random()*900}deg;animation-duration:${1.6+Math.random()*1.6}s;animation-delay:${Math.random()*.3}s`;
    document.body.appendChild(e);setTimeout(()=>e.remove(),3800)}}
function checkProgress(){
  const s=stats();let any=false;
  for(const[id,icn,t,d,test]of ACH){if(!db.ach.includes(id)&&test(s)){db.ach.push(id);any=true;toast(icn,'Достижение: '+t,'+50 XP');}}
  const lv=lvlOf(xpOf(s));
  if(lv>db.lvl){toast('crown',`Новый уровень ${lv}!`,TITLES[Math.min(lv-1,5)]);any=true}
  if(lv!==db.lvl){db.lvl=lv}
  if(any){confetti();save()}
}

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});

const openDlg=h=>{dlg.innerHTML=h;dlg.showModal()};
const dlg=$('#dlg');
const btns=(del)=>`<div class="row" style="margin-top:18px">${del?`<button type="button" class="btn d" onclick="${del}">${ic('trash','sm')}Удалить</button>`:''}<span class="sp"></span><button type="button" class="btn g" onclick="dlg.close()">Отмена</button><button class="btn">${ic('check','sm')}Сохранить</button></div>`;

// ================= обзор =================
function vHome(){
  const s=stats(),xp=xpOf(s),lv=lvlOf(xp),lo=thr(lv),hi=thr(lv+1);
  const pct=Math.min(100,(xp-lo)/(hi-lo)*100);
  const t=today(),h=new Date().getHours();
  const hello=h<5?'Доброй ночи':h<12?'Доброе утро':h<18?'Добрый день':'Добрый вечер';
  const todayL=db.lessons.filter(l=>l.date===t&&l.status!=='cancelled').sort((a,b)=>a.time.localeCompare(b.time));
  const todo=db.lessons.filter(l=>l.status==='planned'&&(l.date<t||(l.date===t&&toMin(l.time)+l.dur<=new Date().getHours()*60+new Date().getMinutes()))).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const debtors=db.students.filter(x=>balance(x.id)<0).sort((a,b)=>balance(a.id)-balance(b.id));
  const gp=db.goal>0?Math.min(1,s.monthInc/db.goal):0,C=2*Math.PI*40;
  let h2=`<div class="hero"><h1>${hello}${db.name?', '+esc(db.name):''}!</h1>
    <div class="lv">${ic('crown','sm')}Уровень ${lv} · ${TITLES[Math.min(lv-1,5)]}</div>
    <div class="bar-p"><i style="width:${pct}%"></i></div>
    <div class="xp">${xp} XP · до уровня ${lv+1} осталось ${hi-xp} XP</div></div>
  <div class="grid3">
    <div class="card kpi wide"><div class="row" style="flex-wrap:nowrap"><div class="ring">
      <svg width="96" height="96" viewBox="0 0 96 96"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#6d5dfc"/><stop offset="1" stop-color="#ff6bb0"/></linearGradient></defs>
      <circle cx="48" cy="48" r="40" fill="none" stroke="var(--line)" stroke-width="10"/>
      <circle cx="48" cy="48" r="40" fill="none" stroke="url(#g)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-gp)}"/></svg>
      <b>${Math.round(gp*100)}%</b></div>
      <div><span class="mut">Цель месяца</span><b style="display:block">${money(s.monthInc)}</b><span class="mut">из ${money(db.goal)}</span></div></div></div>
    <div class="card kpi"><div class="ico" style="background:#f59f0020;color:var(--warn)">${ic('flame')}</div><b>${s.streak}</b><span class="mut">${s.streak?'недель подряд':'серия недель'}</span></div>
    <div class="card kpi"><div class="ico" style="background:#12b88620;color:var(--ok)">${ic('check')}</div><b>${s.done}</b><span class="mut">занятий проведено</span></div>
  </div>`;
  if(!db.students.length){
    h2+=`<div class="card empty">${ic('rocket')}<h3>Начнём!</h3><p class="mut">Добавьте первого ученика — и получите первое достижение.</p><button class="btn" onclick="studentForm()">${ic('plus','sm')}Добавить ученика</button></div>`;
  }
  if(todo.length){h2+=`<div class="sect">Нужно отметить (${todo.length})</div>`+todo.slice(0,6).map(l=>lessonRow(l,true)).join('')}
  h2+=`<div class="sect">Сегодня</div>`+(todayL.length?todayL.map(l=>lessonRow(l)).join(''):`<div class="card empty" style="padding:22px">Сегодня занятий нет</div>`);
  if(debtors.length)h2+=`<div class="sect">Должники</div>`+debtors.map(x=>`<div class="li" style="--c:${x.color}">${avatar(x,'sm')}<div class="sp t">${esc(x.name)}</div>${balChip(balance(x.id))}<button class="btn s ok" onclick="payForm('${x.id}')">${ic('plus','sm')}Оплата</button></div>`).join('');
  h2+=`<div class="sect">Достижения · ${db.ach.length}/${ACH.length}</div><div class="ach">`+
    ACH.map(([id,icn,t,d])=>`<div class="${db.ach.includes(id)?'':'lock'}"><div class="ai">${ic(db.ach.includes(id)?icn:'lock','lg')}</div><b>${t}</b><span>${d}</span></div>`).join('')+`</div>`;
  return h2;
}
function lessonRow(l,late){
  const x=stu(l.student);
  return `<div class="li" style="--c:${x?.color}">${avatar(x,'sm')}<div class="sp"><div class="t">${esc(x?.name||'удалён')}</div>
    <div class="mut">${late?l.date.split('-').reverse().slice(0,2).join('.')+' · ':''}${l.time} · ${l.dur} мин · ${money(l.price)}${l.subject?' · '+esc(l.subject):''}</div></div>
    ${l.status==='planned'?`<button class="btn s ok" onclick="setSt('${l.id}','done')">${ic('check','sm')}Проведено</button>`:`<span class="chip ${l.status==='done'?'ok':l.status==='missed'?'bad':''}">${ST[l.status]}</span>`}
    <button class="btn g s" onclick="lessonForm('${l.id}')">${ic('edit','sm')}</button></div>`;
}
function setSt(id,st){
  const l=db.lessons.find(x=>x.id===id);l.status=st;save();
  if(st==='done'){confetti(40);toast('zap','+20 XP','Занятие проведено')}
  render();
}

// ================= календарь =================
function calNav(n){
  if(calMode==='week')calDate=addDays(calDate,7*n);else{calDate=new Date(calDate.getFullYear(),calDate.getMonth()+n,1)}
  render()}
function vCal(){
  const t=today();
  let title,body;
  if(calMode==='week'){
    const st=mondayOf(calDate),days=[...Array(7)].map((_,i)=>addDays(st,i)),ds=days.map(ymd);
    const ls=db.lessons.filter(l=>ds.includes(l.date));
    let H0=8,H1=22;
    for(const l of ls){H0=Math.min(H0,Math.floor(toMin(l.time)/60));H1=Math.max(H1,Math.ceil((toMin(l.time)+l.dur)/60))}
    const HH=54,n=H1-H0;
    const a=days[0],b=days[6];
    title=a.getMonth()===b.getMonth()?`${a.getDate()}–${b.getDate()} ${b.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}`:`${a.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})} – ${b.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}`;
    const nowM=new Date().getHours()*60+new Date().getMinutes();
    body=`<div class="scroll"><div class="wk"><div class="wk-h"><div></div>${days.map((d,i)=>`<div class="${ds[i]===t?'today':''}">${d.toLocaleDateString('ru-RU',{weekday:'short'})}<b>${d.getDate()}</b></div>`).join('')}</div>
    <div class="wk-b" style="height:${n*HH}px;--hh:${HH}px"><div class="gut">${[...Array(n)].map((_,i)=>`<span style="top:${i*HH}px;${i?'':'display:none'}">${String(H0+i).padStart(2,'0')}:00</span>`).join('')}</div>
    ${ds.map(d=>`<div class="col ${d===t?'today':''}" onclick="slotClick(event,'${d}',${H0},${HH})">
      ${ls.filter(l=>l.date===d).map(l=>{const x=stu(l.student),top=(toMin(l.time)-H0*60)/60*HH,h=Math.max(24,l.dur/60*HH-2);
        return `<div class="ev ${l.status}" style="--c:${x?.color};top:${top}px;height:${h}px" onclick="event.stopPropagation();lessonForm('${l.id}')"><b>${l.time} ${esc(x?.name||'')}</b>${h>40?`<span class="mut" style="color:inherit;opacity:.75">${l.dur} мин${l.subject?' · '+esc(l.subject):''}</span>`:''}${l.status==='done'?ic('check','ck'):''}</div>`}).join('')}
      ${d===t&&nowM>=H0*60&&nowM<=H1*60?`<div class="now" style="top:${(nowM-H0*60)/60*HH}px"></div>`:''}</div>`).join('')}</div></div></div>`;
  }else{
    const y=calDate.getFullYear(),m=calDate.getMonth();
    title=new Date(y,m,1).toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
    const first=mondayOf(new Date(y,m,1)),last=new Date(y,m+1,0);
    const weeks=Math.ceil(((last-first)/864e5+1)/7);
    let cells='';
    for(let i=0;i<weeks*7;i++){
      const d=addDays(first,i),k=ymd(d),ls=db.lessons.filter(l=>l.date===k).sort((a,b)=>a.time.localeCompare(b.time));
      cells+=`<div class="d ${d.getMonth()!==m?'out':''} ${k===t?'today':''}" onclick="lessonForm(null,{date:'${k}'})"><span class="n">${d.getDate()}</span>
      ${ls.slice(0,3).map(l=>{const x=stu(l.student);return `<div class="c ${l.status}" style="--c:${x?.color}" onclick="event.stopPropagation();lessonForm('${l.id}')"><span>${l.time} ${esc(x?.name.split(' ')[0]||'')}</span></div>`}).join('')}
      ${ls.length>3?`<div class="more">ещё ${ls.length-3}</div>`:''}</div>`}
    body=`<div class="scroll"><div class="mo">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d=>`<div class="dh">${d}</div>`).join('')}${cells}</div></div>`;
  }
  return `<div class="calbar"><button class="iconbtn" onclick="calNav(-1)">${ic('l')}</button><button class="iconbtn" onclick="calNav(1)">${ic('r')}</button>
    <div class="ttl">${title}</div><span class="sp"></span>
    <button class="btn g s" onclick="calDate=new Date();render()">Сегодня</button>
    <div class="seg"><button class="${calMode==='week'?'on':''}" onclick="calMode='week';render()">Неделя</button><button class="${calMode==='month'?'on':''}" onclick="calMode='month';render()">Месяц</button></div>
    <button class="btn" onclick="lessonForm()">${ic('plus','sm')}Занятие</button></div>${body}
    <p class="mut" style="text-align:center;margin-top:10px">Нажмите на свободное место в календаре, чтобы назначить занятие</p>`;
}
function slotClick(e,date,H0,HH){
  const y=e.clientY-e.currentTarget.getBoundingClientRect().top;
  const m=H0*60+Math.floor(y/HH*2)*30;
  lessonForm(null,{date,time:String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')});
}

function lessonForm(id,pre={}){
  if(!db.students.length){toast('users','Сначала добавьте ученика');view='students';render();return}
  const f0=db.students.find(s=>s.id===pre.student)||db.students[0];
  const l=db.lessons.find(x=>x.id===id)||{student:f0.id,date:pre.date||today(),time:pre.time||'16:00',dur:f0.dur||60,price:f0.rate||0,subject:'',note:'',status:'planned'};
  openDlg(`<h2>${id?'Занятие':'Новое занятие'}</h2><form id="f">
   <label>Ученик</label><select name="student" onchange="const s=stu(this.value);this.form.price.value=s.rate||0;this.form.dur.value=s.dur||60">
     ${db.students.map(s=>`<option value="${s.id}" ${s.id===l.student?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
   <div class="two"><div><label>Дата</label><input type="date" name="date" value="${l.date}" required></div>
   <div><label>Время</label><input type="time" name="time" value="${l.time}" step="900" required></div></div>
   <div class="two"><div><label>Длительность, мин</label><input type="number" name="dur" min="5" step="5" value="${l.dur}" required></div>
   <div><label>Стоимость, ₸</label><input type="number" name="price" min="0" value="${l.price}" required></div></div>
   <label>Тема / предмет</label><input name="subject" value="${esc(l.subject)}" placeholder="Например: Алгебра, дроби">
   <label>Заметка</label><input name="note" value="${esc(l.note)}">
   ${id?`<label>Статус</label><div class="sw">${Object.entries(ST).map(([k,v])=>`<label><input type="radio" name="status" value="${k}" ${l.status===k?'checked':''}><span>${v}</span></label>`).join('')}</div>`
      :`<label>Повторять еженедельно (всего занятий)</label><input type="number" name="rep" min="1" max="52" value="1">`}
   ${btns(id?`delLesson('${id}')`:'')}</form>`);
  $('#f').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
    const base={student:f.student,time:f.time,dur:+f.dur,price:+f.price,subject:f.subject.trim(),note:f.note.trim()};
    const dates=[];const n=id?1:Math.max(1,+f.rep||1);
    for(let i=0;i<n;i++)dates.push(ymd(addDays(new Date(f.date+'T00:00'),7*i)));
    const clash=dates.some(d=>db.lessons.some(o=>o.id!==id&&o.date===d&&o.status!=='cancelled'&&toMin(o.time)<toMin(base.time)+base.dur&&toMin(base.time)<toMin(o.time)+o.dur));
    if(clash&&!confirm('Это время пересекается с другим занятием. Всё равно сохранить?'))return;
    const wasDone=l.status==='done';
    if(id){Object.assign(l,base,{date:f.date,status:f.status||l.status});if(!wasDone&&l.status==='done'){confetti(40);toast('zap','+20 XP','Занятие проведено')}}
    else dates.forEach(d=>db.lessons.push({id:uid(),...base,date:d,status:'planned'}));
    save();dlg.close();if(!id)toast('cal',n>1?`Назначено занятий: ${n}`:'Занятие назначено');render()};
}
function delLesson(id){if(confirm('Удалить занятие?')){db.lessons=db.lessons.filter(l=>l.id!==id);save();dlg.close();render()}}

      ${s.note?`<div class="mut" style="margin-top:4px">${esc(s.note)}</div>`:''}

  }
  return h;

function studentForm(id){
  const s=db.students.find(x=>x.id===id)||{name:'',contact:'',rate:5000,dur:60,note:''};
  openDlg(`<h2>${id?'Ученик':'Новый ученик'}</h2><form id="f">
   <label>Имя</label><input name="name" value="${esc(s.name)}" required autofocus>
   <label>Контакты (телефон, Telegram, родители)</label><input name="contact" value="${esc(s.contact)}">
   <div class="two"><div><label>Цена занятия, ₸</label><input type="number" name="rate" min="0" value="${s.rate}" required></div>
   <div><label>Длительность, мин</label><input type="number" name="dur" min="5" step="5" value="${s.dur}" required></div></div>
   <label>Заметки (класс, цели, уровень)</label><textarea name="note" rows="3">${esc(s.note)}</textarea>${btns()}</form>`);
  $('#f').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
    const v={name:f.name.trim(),contact:f.contact.trim(),rate:+f.rate,dur:+f.dur,note:f.note.trim()};
    if(id)Object.assign(s,v);else db.students.push({id:uid(),color:COLORS[db.students.length%COLORS.length],...v});
    save();dlg.close();render()};
}
function delStudent(id){
  if(!confirm('Удалить ученика вместе с его занятиями и оплатами?'))return;
  db.students=db.students.filter(s=>s.id!==id);db.lessons=db.lessons.filter(l=>l.student!==id);db.payments=db.payments.filter(p=>p.student!==id);save();render()}

// ================= оплаты =================
function vPayments(){
  const ps=db.payments.filter(p=>!payFlt||p.student===payFlt).sort((a,b)=>b.date.localeCompare(a.date));
  const total=ps.reduce((a,p)=>a+p.amount,0);
  let h=`<div class="head"><h2>Оплаты</h2><span class="sp"></span>
   <select class="flt" onchange="payFlt=this.value;render()"><option value="">Все ученики</option>${db.students.map(s=>`<option value="${s.id}" ${payFlt===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
   <button class="btn" onclick="payForm()">${ic('plus','sm')}Оплата</button></div>`;
  if(db.students.length){
    h+=`<div class="card"><h3 style="margin-bottom:10px">Баланс учеников</h3>`+db.students.map(s=>`<div class="row" style="margin:8px 0">${avatar(s,'sm')}<span class="sp" style="font-weight:700">${esc(s.name)}</span>${balChip(balance(s.id))}</div>`).join('')+
    `<div class="mut" style="margin-top:8px">Баланс = оплачено − стоимость проведённых и платно пропущенных занятий.</div></div>`;
  }
  if(!ps.length)return h+`<div class="card empty">${ic('wallet')}<p>Оплат пока нет</p></div>`;
  h+=`<div class="sect">История · итого ${money(total)}</div>`;
  for(const p of ps){const x=stu(p.student);
    h+=`<div class="li" style="--c:${x?.color}">${avatar(x,'sm')}<div class="sp"><div class="t">${esc(x?.name||'удалён')} <span class="ok">+${money(p.amount)}</span></div>
     <div class="mut">${p.date.split('-').reverse().join('.')} · ${esc(p.method)}${p.note?' · '+esc(p.note):''}</div></div>
     <button class="btn g s" onclick="payForm(null,'${p.id}')">${ic('edit','sm')}</button><button class="btn d s" onclick="delPay('${p.id}')">${ic('trash','sm')}</button></div>`;
  }
  return h;
}
function delPay(id){if(confirm('Удалить оплату?')){db.payments=db.payments.filter(p=>p.id!==id);save();render()}}
function payForm(sid,id){
  if(!db.students.length){toast('users','Сначала добавьте ученика');return}
  const sel=sid||db.students[0].id;
  const p=db.payments.find(x=>x.id===id)||{student:sel,amount:Math.max(0,-balance(sel))||stu(sel).rate,date:today(),method:'Kaspi',note:''};
  const methods=['Kaspi','Перевод','Наличные','Карта','Другое'];
  openDlg(`<h2>${id?'Оплата':'Новая оплата'}</h2><form id="f">
   <label>Ученик</label><select name="student" onchange="const b=balance(this.value);this.form.amount.value=b<0?-b:(stu(this.value).rate||0)">
    ${db.students.map(s=>`<option value="${s.id}" ${s.id===p.student?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
   <div class="two"><div><label>Сумма, ₸</label><input type="number" name="amount" min="1" value="${p.amount}" required></div>
   <div><label>Дата</label><input type="date" name="date" value="${p.date}" required></div></div>
   <label>Способ</label><select name="method">${methods.map(m=>`<option ${m===p.method?'selected':''}>${m}</option>`).join('')}</select>
   <label>Заметка</label><input name="note" value="${esc(p.note)}">${btns()}</form>`);
  $('#f').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
    const v={student:f.student,amount:+f.amount,date:f.date,method:f.method,note:f.note.trim()};
    if(id)Object.assign(p,v);else{db.payments.push({id:uid(),...v});toast('wallet','Оплата записана',`+10 XP · ${money(v.amount)}`)}
    save();dlg.close();render()};
}

// ================= профиль и копии =================
function profileForm(){
  openDlg(`<h2>Профиль и данные</h2><form id="f">
   <label>Ваше имя</label><input name="name" value="${esc(db.name)}" placeholder="Как к вам обращаться">
   <label>Цель по доходу на месяц, ₸</label><input type="number" name="goal" min="0" step="1000" value="${db.goal}">
   <div class="row" style="margin-top:16px"><button type="button" class="btn g s" onclick="exportData()">${ic('down','sm')}Скачать копию</button>
   <button type="button" class="btn g s" onclick="importData()">${ic('up','sm')}Загрузить копию</button></div>
   <p class="mut">Данные хранятся только в этом браузере. Делайте копию хотя бы раз в неделю.</p>${btns()}</form>`);
  $('#f').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));db.name=f.name.trim();db.goal=+f.goal||0;save();dlg.close();render()};
}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,1)],{type:'application/json'}));a.download=`tutor-backup-${today()}.json`;a.click()}
function importData(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{try{const d=JSON.parse(await i.files[0].text());
  if(!d.students||!d.lessons||!d.payments)throw 0;if(confirm('Заменить текущие данные резервной копией?')){db=Object.assign({name:'',goal:300000,ach:[],lvl:1},d);
  db.students.forEach((s,k)=>{if(!s.color)s.color=COLORS[k%8]});save();dlg.close();render()}}catch(e){alert('Неверный файл')}};i.click()}

db.students.forEach((s,k)=>{if(!s.color)s.color=COLORS[k%8]});
render();
</script>
</body>
</html>
